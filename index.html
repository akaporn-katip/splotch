    <!--
      DIRECTION CONTRACT — Splotch, vol. 1

      THESIS: A cartoon component kit printed as a mid-century UPA proof sheet, where
      misregistered spot inks, cut-paper shapes, halftone dots and drawn key lines do
      every job that borders and drop shadows do elsewhere. The category's neubrutalist
      skin (4px black outline + black offset shadow on grey Radix parts) is refused.

      OWN-WORLD: Deep teal field, bone paper, mustard and coral spots, ink key plate.
      Every raised surface carries a spot-colour plate 5px out of register, never a
      blurred or black shadow. Corners are cut, not rounded: four different radii.
      Halftone dot fields and press grain sit over flat unmodulated colour. Type is
      Alfa Slab One for display, Jost for everything else, small caps for apparatus.

      STORY: The visitor presses real components inside the first viewport, learns the
      kit is a full system rather than a skin, re-inks the entire page like operating a
      press, then reads the markup and the anatomy.

      FIRST VIEWPORT: Full-bleed teal with grain and registration marks. A bone proof
      sheet, rotated -1.2deg, holds the display headline "PRESS THE PAPER." and a live
      control cluster (BOING / WOBBLE / BOUNCE / HALFTONE) that drives a cut-paper
      mascot leaning in from the left edge, half off the sheet, answering in a speech
      balloon. The primary action sits inside that cluster, not in a separate CTA band.

      FORM: Mid-century modern cartoon (UPA / limited animation), 3rd of 7 grounded
      directions. Seed 9b0c757b.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->

    <script type="module" src="/src/main.tsx"></script>
